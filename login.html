<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Login | Coffee Shop</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Sign in or create a coffee shop ordering account" name="description">
    <link href="img/favicon.ico" rel="icon">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.min.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid p-0 nav-bar">
        <nav class="navbar navbar-expand-lg bg-none navbar-dark py-3">
            <a href="index.html" class="navbar-brand px-lg-4 m-0">
                <h1 class="m-0 display-4 text-uppercase text-white">COFFEE SHOP</h1>
            </a>
            <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-between" id="navbarCollapse">
                <div class="navbar-nav ml-auto p-4">
                    <a href="index.html" class="nav-item nav-link">Home</a>
                    <a href="about.html" class="nav-item nav-link">About</a>
                    <a href="service.html" class="nav-item nav-link">Service</a>
                    <a href="menu.html" class="nav-item nav-link">Menu</a>
                    <a href="reservation.html" class="nav-item nav-link">Reservation</a>
                    <a href="contact.html" class="nav-item nav-link">Contact</a>
                    <a href="login.html" class="nav-item nav-link active">Login</a>
                </div>
            </div>
        </nav>
    </div>

    <div class="container-fluid page-header mb-5 position-relative overlay-bottom">
        <div class="d-flex flex-column align-items-center justify-content-center pt-0 pt-lg-5" style="min-height: 320px">
            <h1 class="display-4 mb-3 mt-0 mt-lg-5 text-white text-uppercase">Your Account</h1>
            <div class="d-inline-flex mb-lg-5">
                <p class="m-0 text-white"><a class="text-white" href="index.html">Home</a></p>
                <p class="m-0 text-white px-2">/</p>
                <p class="m-0 text-white">Login</p>
            </div>
        </div>
    </div>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="section-title">
                    <h4 class="text-primary text-uppercase" style="letter-spacing: 5px;">Coffee Shop</h4>
                    <h1 class="display-4">Sign in to order</h1>
                </div>
                <div id="authFeedback" aria-live="polite"></div>
                <section id="signedInPanel" class="border p-4" hidden>
                    <h2 class="h4 mb-3">You are signed in</h2>
                    <p id="signedInDetails" class="mb-4"></p>
                    <a class="btn btn-primary mr-2" href="order.html">Continue to checkout</a>
                    <button class="btn btn-outline-secondary" id="logoutButton" type="button">Log out</button>
                </section>
                <section id="authForms" class="border p-4">
                    <div class="btn-group d-flex mb-4" role="group" aria-label="Account options">
                        <button class="btn btn-primary w-50" id="showLoginButton" type="button" aria-pressed="true">Login</button>
                        <button class="btn btn-outline-primary w-50" id="showRegisterButton" type="button" aria-pressed="false">Create Account</button>
                    </div>
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="loginEmail">Email</label>
                            <input class="form-control" id="loginEmail" name="email" type="email" maxlength="254" autocomplete="email" required>
                        </div>
                        <div class="form-group">
                            <label for="loginPassword">Password</label>
                            <input class="form-control" id="loginPassword" name="password" type="password" autocomplete="current-password" required>
                        </div>
                        <button class="btn btn-primary btn-block py-3" type="submit">Login</button>
                    </form>
                    <form id="registerForm" hidden>
                        <div class="form-group">
                            <label for="registerName">Full name</label>
                            <input class="form-control" id="registerName" name="name" type="text" maxlength="100" autocomplete="name" required>
                        </div>
                        <div class="form-group">
                            <label for="registerEmail">Email</label>
                            <input class="form-control" id="registerEmail" name="email" type="email" maxlength="254" autocomplete="email" required>
                        </div>
                        <div class="form-group">
                            <label for="registerPhone">Phone number</label>
                            <input class="form-control" id="registerPhone" name="phone" type="tel" maxlength="40" autocomplete="tel" required>
                        </div>
                        <div class="form-group">
                            <label for="registerPassword">Password (at least 8 characters)</label>
                            <input class="form-control" id="registerPassword" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                        </div>
                        <button class="btn btn-primary btn-block py-3" type="submit">Create Account</button>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <div class="container-fluid footer text-white mt-5 pt-5 px-0 position-relative overlay-top">
        <div class="row mx-0 pt-5 px-sm-3 px-lg-5 mt-4">
            <div class="col-lg-3 col-md-6 mb-5">
                <h4 class="text-white text-uppercase mb-4" style="letter-spacing: 3px;">Quick Links</h4>
                <p><a class="text-white" href="index.html">Home</a></p>
                <p><a class="text-white" href="menu.html">Menu</a></p>
                <p><a class="text-white" href="order.html">Checkout</a></p>
                <p class="m-0"><a class="text-white" href="contact.html">Contact</a></p>
            </div>
            <div class="col-lg-3 col-md-6 mb-5">
                <h4 class="text-white text-uppercase mb-4" style="letter-spacing: 3px;">Open Hours</h4>
                <h6 class="text-white text-uppercase">Monday - Friday</h6>
                <p>7.00 AM - 9.00 PM</p>
                <h6 class="text-white text-uppercase">Saturday - Sunday</h6>
                <p>7.00 AM - 10.00 PM</p>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
